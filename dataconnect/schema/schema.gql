# 1.User Table
type User @table(key: "clerkId") {
  clerkId: String! @unique
  email: String! @unique
  unsername: String
  imageUrl: String
}

#2. The Skills Table

type Skill @table {
  id: UUID! @default(expr: "uuidV4()")

  #Relationship
  author: User!

  #Skill Content
  title: String!
  description: String!
  tags: [String!]!

  #Technical
  installCommand: String!
  promtConfig: String!
  usageExample: String!

  #Metadata
  createdAt: Timestamp! @default(expr: "request.time")
}
